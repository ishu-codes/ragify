<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ragify — Grounded answers from your documents</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Upload PDFs, Markdown, code, and JSON into isolated workspaces. Ragify retrieves the right context and answers with exact source citations." />
  <meta name="theme-color" content="#2e1b9c" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
        var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
