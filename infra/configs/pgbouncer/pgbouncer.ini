[databases]
ragify = host=db port=5432 dbname=ragify
pgbench_test = host=db port=5432 dbname=pgbench_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

max_client_conn = 500
default_pool_size = 20

admin_users = ragify
