  db:
    container_name: ragify-db
    image: postgres:16.10-alpine
    env_file:
      - ../../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragify}
      POSTGRES_DB: ${POSTGRES_DB:-ragify}

    volumes:
      - ../volumes/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragify} -d ${POSTGRES_DB:-ragify}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  vector_db:
    container_name: ragify_qdrant
    image: qdrant/qdrant:v1.17
    env_file:
      - ../../.env
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ../volumes/qdrant:/qdrant/storage
      - ../configs/qdrant.yaml:/qdrant/config/config.yaml

    command: ["./qdrant", "--config-path", "/qdrant/config/config.yaml"]

  grobid:
    container_name: ragify-grobid
    image: grobid/grobid:0.9.0-crf
    ports:
      - "${GROBID_PORT:-8070}:8070"
    ulimits:
      core:
        soft: 0
        hard: 0
    init: true
    restart: unless-stopped

volumes:
  data:
